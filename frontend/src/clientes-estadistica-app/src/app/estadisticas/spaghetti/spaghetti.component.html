<div class="container mx-auto w-full">
  <!-- Loader que se muestra mientras se cargan los datos -->
  <!-- AGREGADO: pantalla de carga -->
  <div *ngIf="isLoading" class="flex items-center justify-center">
    <div class="loader justify-center"></div>
  </div>
  <div *ngIf="!isLoading" class="container mx-auto w-full">
    <div id="chart">
      <apx-chart
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [xaxis]="chartOptions.xaxis"
        [dataLabels]="chartOptions.dataLabels"
        [yaxis]="chartOptions.yaxis"
        [legend]="chartOptions.legend"
        [grid]="chartOptions.grid"
        [stroke]="chartOptions.stroke"
        [title]="chartOptions.title"
        [tooltip]="chartOptions.tooltip"
      ></apx-chart>
    </div>
  </div>
</div>
