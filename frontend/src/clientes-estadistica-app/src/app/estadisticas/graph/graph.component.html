<div class="container mx-auto w-full">
  <!-- Loader que se muestra mientras se cargan los datos -->
  <!-- AGREGADO: pantalla de carga -->
  <div *ngIf="isLoading" class="flex items-center justify-center">
    <div class="loader justify-center"></div>
  </div>

  <!-- Contenido principal del componente -->
  <!-- Ocultar el contenido principal mientras se cargan los datos -->
  <div *ngIf="!isLoading">
    <div class="dropdown-container">
      <select id="data-type" (change)="onSelectionChange($event)">
        <option value="sexo">Sexo</option>
        <option value="edad">Edad</option>
        <option value="trabajo">Trabajo</option>
      </select>
    </div>

    <!--The content below is only a placeholder and can be replaced.-->
    <div id="chart">
      <apx-chart
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [xaxis]="chartOptions.xaxis"
        [stroke]="chartOptions.stroke"
        [tooltip]="chartOptions.tooltip"
        [dataLabels]="chartOptions.dataLabels"
        [title]="chartOptions.title"
      ></apx-chart>
    </div>
  </div>
</div>
