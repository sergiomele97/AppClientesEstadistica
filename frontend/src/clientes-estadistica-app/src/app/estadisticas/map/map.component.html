<div class="container mx-auto w-full">
    <!-- Loader que se muestra mientras se cargan los datos -->
    <!-- AGREGADO: pantalla de carga -->
    <div *ngIf="isLoading" class="flex items-center justify-center">
      <div class="loader justify-center"></div>
    </div>

    <!-- Para inyección en página principal.-->
    <div *ngIf="!isLoading" class="center">
    <highcharts-chart
        id="container" 
        [Highcharts]="Highcharts"
        [constructorType]="'mapChart'"
        [options]="chartOptions"
        style="width: 100%; height: 400px; display: block;">
        </highcharts-chart>
    </div>
</div>
