<div class="alert-container">
  <div
    *ngIf="detectado"
    class="text-red-700 bg-red-100 rounded-xl shadow-lg"
    role="alert"
  >
    <div class="flex p-5">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-7 mt-1 mr-2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
        />
      </svg>
      <h3 class="text-xl font-semibold">Outlier Detectado</h3>
    </div>
  </div>

  <div
    *ngIf="eliminado"
    class="text-green-700 bg-green-100 rounded-xl shadow-lg"
    role="alert"
  >
    <div class="flex p-5">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-7 mt-1 mr-2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M5.25 12l5.5 5.5L19.25 7.5"
        />
      </svg>
      <h3 class="text-xl font-semibold">Outlier Eliminado</h3>
    </div>
  </div>
</div>
