<div class="p-4 flex flex-col items-center w-full min-h-screen">
  <div id="chart" class="w-full max-w-4xl mb-6">
    <apx-chart
      [series]="chartOptions.series"
      [chart]="chartOptions.chart"
      [xaxis]="chartOptions.xaxis"
      [yaxis]="chartOptions.yaxis"
      [title]="chartOptions.title"
      [plotOptions]="chartOptions.plotOptions"
      [dataLabels]="chartOptions.dataLabels"
      [fill]="chartOptions.fill"
    >
    </apx-chart>
  </div>

  <div *ngIf="transacciones" class="w-full max-w-4xl">
    <table
      class="w-full text-sm text-left text-gray-500 border border-gray-300 rounded-md bg-white shadow-md"
    >
      <thead class="text-xs text-gray-700 uppercase bg-gray-200">
        <tr>
          <th scope="col" class="px-4 py-2 border-b">Receptor</th>
          <th scope="col" class="px-4 py-2 border-b">Cantidad</th>
          <th scope="col" class="px-4 py-2 border-b">Fecha</th>
          <th scope="col" class="px-4 py-2 border-b">Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let transaccion of transacciones"
          [ngClass]="{ 'bg-red-100': transaccion.isOutlier }"
          class="bg-white border-b"
        >
          <td class="px-4 py-2">
            <a
              [routerLink]="[
                '/estadistica/clientes/',
                transaccion.clienteDestinoId
              ]"
            >
              {{ transaccion.clienteDestino.nombre }}
            </a>
          </td>
          <td class="px-4 py-2">
            {{ transaccion.importeEnviado | customCurrency }}
          </td>
          <td class="px-4 py-2">
            {{ transaccion.fecha | formaterFecha }}
          </td>
          <td class="px-4 py-2 text-center">
            <button
              *ngIf="transaccion.isOutlier"
              (click)="borrarOutlier(transaccion.transaccionId)"
              class="px-3 py-1 text-xs font-semibold text-white bg-red-600 rounded-lg hover:bg-red-700"
            >
              Resolver
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
