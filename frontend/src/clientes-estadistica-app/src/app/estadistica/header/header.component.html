<!-- HEADER -->
<header
  class="fixed top-0 left-0 right-0 z-50 h-16 px-7 py-5 bg-gray-50 dark:bg-gray-800 flex justify-between items-center shadow-md"
>
  <h1
    class="text-3xl font-extrabold text-gray-900 dark:text-white md:text-5xl lg:text-4xl"
  >
    <a
      routerLink="/estadistica"
      class="text-transparent bg-clip-text bg-gradient-to-r to-emerald-600 from-sky-400"
      >ChachiData</a
    >
  </h1>
  <div class="relative flex items-center space-x-3">
    <!-- Username with Dropdown Trigger -->
    <p
      class="text-blue-500 font-bold transition duration-75 dark:text-blue-300 cursor-pointer"
      (click)="toggleDropdown($event)"
    >
      {{ username || "Admin" }}
    </p>

    <!-- Icon -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="#1E90FF"
      class="w-8 h-8 cursor-pointer"
      (click)="toggleDropdown($event)"
    >
      <path
        fill-rule="evenodd"
        d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
        clip-rule="evenodd"
      />
    </svg>

    <!-- Dropdown Menu -->
    <div
      *ngIf="isDropdownOpen"
      class="absolute right-0 top-full mt-2 w-48 bg-white dark:bg-gray-800 shadow-lg rounded-lg transition-opacity duration-300 ease-in-out opacity-100 z-50"
    >
      <a
        (click)="logout()"
        class="block px-4 py-2 text-gray-900 dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 rounded-b-lg transition-colors duration-200 cursor-pointer"
        >Logout</a
      >
    </div>
  </div>
</header>
