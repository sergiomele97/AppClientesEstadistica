<section class="bg-gray-50 dark:bg-gray-900 bg-image">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
    <h1 class="mb-4 text-3xl font-extrabold text-gray-900 dark:text-white md:text-5xl lg:text-4xl">
      <span class="text-transparent bg-clip-text bg-gradient-to-r to-emerald-600 from-sky-400">ChachiData</span>
    </h1>
    <div
      class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
      <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
          Create an account
        </h1>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form space-y-4 md:space-y-6">
          <div>
            <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Your email</label>
            <input type="email" name="email" id="email" formControlName="email"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
              placeholder="name@company.com" required="">
            <div *ngIf="registerForm.get('email').invalid && registerForm.get('email').touched" class="text-red-500">
              <div *ngIf="registerForm.get('email').hasError('required')">El email es requerido.</div>
              <div *ngIf="registerForm.get('email').hasError('email')">El email no es válido.</div>

            </div>
            <div>
              <label for="password"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password</label>
              <input type="password" name="password" id="password" formControlName="password" placeholder="••••••••"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                required="">
              <div *ngIf="registerForm.get('password').invalid && registerForm.get('password').touched" class="text-red-500">
                <div *ngIf="registerForm.get('password').hasError('required')">La contraseña es requerida.</div>
                <div *ngIf="registerForm.get('password').hasError('minlength')">La contraseña debe tener al menos 6 caracteres.</div>
              </div>
            </div>
            <div>
              <label for="confirmpassword" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Confirm
                password</label>
              <input type="password" name="confirmpassword" id="confirmpassword" formControlName="confirmpassword" placeholder="••••••••"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                required="">
              <div *ngIf="registerForm.get('confirmpassword').invalid && registerForm.get('confirmpassword').touched" class="text-red-500">
                <div *ngIf="registerForm.get('confirmpassword').hasError('required')">Debes confirmar la contraseña.</div>
                <div *ngIf="registerForm.get('confirmpassword').hasError('passwordMismatch')">Las contraseñas no coinciden.</div>
              </div>
            </div>
            <div>
              <label for="phone" class="block mb-2 text-sm font-medium text-gray-900  dark:text-white">Phone
                number</label>
              <input type="phone" name="phone" id="phone"  formControlName="phone" placeholder="+34 638 112 233"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                required="">
            </div>
            <div class="flex items-start mt-3">
              <div class="flex items-center h-5">
                <input id="terms" aria-describedby="terms" type="checkbox"
                  class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-primary-600 dark:ring-offset-gray-800"
                  required="">
              </div>
              <div class="ml-3 text-sm ">
                <label for="terms" class="font-light  text-gray-500 dark:text-gray-300">I accept the <a
                    class="font-medium text-primary-600 hover:underline dark:text-primary-500" href="#">Terms and
                    Conditions</a></label>
              </div>
            </div>
            <button type="submit"
              class="w-full text-white mt-3 mb-3 bg-blue-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">Create
              an account</button>
            <p class="text-sm font-light text-gray-500 dark:text-gray-400">
              Already have an account? <a href="#"
                class="font-medium text-primary-600 hover:underline dark:text-primary-500">Login here</a>
            </p>
        
          </div>
        </form>
       </div>
    </div>
    
  </div>
</section>
