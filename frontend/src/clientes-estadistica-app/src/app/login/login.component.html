<section class="bg-gray-50 dark:bg-gray-900 bg-image">
  <div class="bg-gray-50 dark:bg-gray-900 bg-image">
    <div
      class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0"
    >
      <!-- CHACHIDATA -->
      <h1
        class="mb-4 text-3xl font-extrabold text-gray-900 dark:text-white md:text-5xl lg:text-4xl"
      >
        <span
          class="text-transparent bg-clip-text bg-gradient-to-r to-emerald-600 from-sky-400"
          >ChachiData</span
        >
      </h1>

      <div
        class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700"
      >
        <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
          <!-- Iniciar sesión -->
          <h1
            class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white"
          >
            Iniciar sesión
          </h1>

          <!-- Formulario Método authentication()-->
          <form (ngSubmit)="onSubmit()" class="form space-y-4 md:space-y-6">
            <!-- Correo -->
            <div>
              <label
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Correo</label
              >
              <div class="relative flex items-center">
                <input
                  name="username"
                  type="text"
                  required
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  placeholder="Introduce el nombre de usuario"
                  [(ngModel)]="email"
                />
              </div>
            </div>

            <!-- Contraseña -->
            <div>
              <label
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Contraseña</label
              >
              <div class="relative flex items-center">
                <input
                  name="password"
                  type="password"
                  required
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  placeholder="Introduce la contraseña"
                  [(ngModel)]="password"
                />
              </div>
            </div>

            <!-- Recuerdame -->
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div class="flex items-center">
                <input
                  id="remember-me"
                  name="remember-me"
                  type="checkbox"
                  [(ngModel)]="rememberMe"
                  class="h-4 w-4 shrink-0 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                />
                <label
                  for="remember-me"
                  class="ml-3 block text-sm text-gray-800"
                  >Recuérdame</label
                >
              </div>
            </div>

            <!-- Botón iniciar sesión -->
            <div class="!mt-8">
              <button
                type="submit"
                class="w-full py-3 px-4 text-sm tracking-wide rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none"
              >
                Iniciar sesión
              </button>
            </div>

            <!-- Enlace a registro -->
            <p class="cursor-pointer text-gray-800 text-sm !mt-8 text-center">
              ¿No tienes una cuenta?
              <a
                (click)="navigateToRegistro()"
                class="text-blue-600 hover:underline ml-1 whitespace-nowrap font-semibold"
              >
                Regístrate aquí
              </a>
            </p>
          </form>
        </div>

        <div
          *ngIf="isErrorVisible"
          class="fixed top-4 right-4 bg-red-500 text-white p-4 rounded shadow-md"
        >
          {{ errorMessage }}
        </div>
      </div>
    </div>
  </div>
</section>
