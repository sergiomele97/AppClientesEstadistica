# YAML modificado para incluir una nueva etapa de pruebas (test).
name: Build, Test, and Deploy ASP.Net Core app to Azure Web App - ChachiBackend

on:
  push:
    branches:
      - produccion
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build backend-estadistica/src/BackendEstadistica/BackendEstadistica.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish backend-estadistica/src/BackendEstadistica/BackendEstadistica.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  # Nuevo Job de Pruebas #GPT: Se añadió una nueva etapa de pruebas.
  test:
    runs-on: windows-latest # Usamos windows para compatibilidad con VSTest
    needs: build # GPT: Este job depende del build para obtener los artefactos.
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Install NuGet # GPT: Instalamos NuGet, similar a Azure DevOps
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages # GPT: Restauramos paquetes
        run: nuget restore backend-estadistica/src/BackendEstadistica.sln

      - name: Build Test Project # GPT: Compilamos el proyecto de pruebas
        run: msbuild backend-estadistica/src/BackendEstadistica.sln /p:Configuration=Release

      - name: Run Tests # GPT: Ejecutamos las pruebas
        run: vstest.console.exe **\*test.dll --parallel # GPT: Ejecutamos en paralelo similar a Azure DevOps.

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test] # GPT: El deploy ahora depende tanto del build como del test.
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ChachiBackend'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_1C79C43975924D0A9D9A5CD7855B4F7A }}